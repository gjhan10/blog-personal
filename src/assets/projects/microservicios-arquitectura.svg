<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Arquitectura prevista de microservicios">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4z" fill="#a4a7ae"/>
    </marker>
  </defs>
  <rect width="800" height="520" fill="#181a1d"/>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" fill="#f2f1ed">
    <rect x="290" y="28" width="220" height="64" rx="16" fill="#202327"/>
    <text x="400" y="56" text-anchor="middle" font-size="18" font-weight="600">Frontend Angular</text>
    <text x="400" y="78" text-anchor="middle" font-size="14" fill="#a4a7ae">cliente web</text>

    <line x1="400" y1="92" x2="400" y2="152" stroke="#a4a7ae" stroke-width="2" marker-end="url(#a)"/>

    <rect x="260" y="156" width="280" height="76" rx="16" fill="#202327" stroke="#82aaff" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="400" y="188" text-anchor="middle" font-size="18" font-weight="600" fill="#82aaff">api-gateway</text>
    <text x="400" y="212" text-anchor="middle" font-size="14" fill="#a4a7ae">enrutamiento y validación del JWT</text>

    <line x1="330" y1="232" x2="150" y2="292" stroke="#a4a7ae" stroke-width="2" marker-end="url(#a)"/>
    <line x1="400" y1="232" x2="400" y2="292" stroke="#a4a7ae" stroke-width="2" marker-end="url(#a)"/>
    <line x1="470" y1="232" x2="650" y2="292" stroke="#a4a7ae" stroke-width="2" marker-end="url(#a)"/>

    <rect x="40" y="296" width="220" height="76" rx="16" fill="#202327" stroke="#c792ea" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="150" y="328" text-anchor="middle" font-size="18" font-weight="600" fill="#c792ea">auth-service</text>
    <text x="150" y="352" text-anchor="middle" font-size="14" fill="#a4a7ae">registro, login, JWT</text>

    <rect x="290" y="296" width="220" height="76" rx="16" fill="#202327" stroke="#c792ea" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="400" y="328" text-anchor="middle" font-size="18" font-weight="600" fill="#c792ea">catalog-service</text>
    <text x="400" y="352" text-anchor="middle" font-size="14" fill="#a4a7ae">productos y stock</text>

    <rect x="540" y="296" width="220" height="76" rx="16" fill="#202327" stroke="#c792ea" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="650" y="328" text-anchor="middle" font-size="18" font-weight="600" fill="#c792ea">orders-service</text>
    <text x="650" y="352" text-anchor="middle" font-size="14" fill="#a4a7ae">pedidos y su estado</text>

    <path d="M540 334H510" stroke="#a4a7ae" stroke-width="2" marker-end="url(#a)"/>

    <line x1="150" y1="372" x2="150" y2="424" stroke="#a4a7ae" stroke-width="2" stroke-dasharray="3 5"/>
    <line x1="400" y1="372" x2="400" y2="424" stroke="#a4a7ae" stroke-width="2" stroke-dasharray="3 5"/>
    <line x1="650" y1="372" x2="650" y2="424" stroke="#a4a7ae" stroke-width="2" stroke-dasharray="3 5"/>
    <rect x="40" y="426" width="720" height="44" rx="12" fill="#181a1d" stroke="#2a2e33" stroke-width="2"/>
    <text x="400" y="454" text-anchor="middle" font-size="15" fill="#a4a7ae">PostgreSQL, una base por servicio</text>

    <text x="400" y="504" text-anchor="middle" font-size="14" fill="#a4a7ae">Diseño propuesto. Aún no hay código.</text>
  </g>
