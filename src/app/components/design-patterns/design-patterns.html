<app-course-layout class="cl-course" [c]="this">
  @if (view === 'lesson') {
    @switch (activeModule) {
      @case (0) {
        <app-dp-module-m1 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-dp-module-m1>
      }
      @case (1) {
        <app-dp-module-m2 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-dp-module-m2>
      }
      @case (2) {
        <app-dp-module-m3 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-dp-module-m3>
      }
    }
  }
</app-course-layout>
