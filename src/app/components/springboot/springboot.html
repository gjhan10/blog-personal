<app-course-layout class="cl-course" [c]="this">
  @if (view === 'lesson') {
    @switch (activeModule) {
      @case (0) {
        <app-sb-module-m1 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m1>
      }
      @case (1) {
        <app-sb-module-m2 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m2>
      }
      @case (2) {
        <app-sb-module-m3 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m3>
      }
      @case (3) {
        <app-sb-module-m4 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m4>
      }
      @case (4) {
        <app-sb-module-m5 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m5>
      }
      @case (5) {
        <app-sb-module-m6 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m6>
      }
      @case (6) {
        <app-sb-module-m7 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m7>
      }
      @case (7) {
        <app-sb-module-m8 [globalLesson]="globalLesson" [isEval]="isCurrentEval" [answer]="boundAnswer"></app-sb-module-m8>
      }
    }
  }
</app-course-layout>
