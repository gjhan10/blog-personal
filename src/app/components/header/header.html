<header class="header" [class.open]="menuOpen()">
  <nav class="navbar pf-container" aria-label="Principal">
    <a class="brand" routerLink="/" aria-label="Jhan Gutierrez, inicio">
      <img src="assets/avatar.jpg" alt="" width="40" height="40" class="avatar" />
      <span class="brand-name">{{ site.name }}</span>
    </a>

    <ul class="nav-menu" id="menu-principal">
      @for (l of links; track l.path) {
        <li><a [routerLink]="l.path" routerLinkActive="active">{{ l.label }}</a></li>
      }
    </ul>

    <div class="tools">
    <app-theme-toggle />
    <button
      type="button"
      class="menu-btn"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="menu-principal"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
      (click)="toggle()"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
    </button>
    </div>
  </nav>
</header>
