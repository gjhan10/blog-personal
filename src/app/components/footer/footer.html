<footer class="footer" [class.compact]="compact()" id="contacto">
  <div class="pf-container">
    @if (!compact()) {
      <h2 class="pf-title ask">¿Listo para crear algo bueno juntos?</h2>
      <a class="mail" [href]="'mailto:' + site.email">{{ site.email }}</a>
      <app-social-tiles class="tiles" />
    }

    <div class="base">
      <p>{{ site.location }}@if (localTime()) {, {{ localTime() }} h}</p>
      <p>© {{ year }} {{ site.name }}. <a [href]="site.repo" target="_blank" rel="noopener noreferrer">Código fuente</a></p>
    </div>
  </div>
</footer>
