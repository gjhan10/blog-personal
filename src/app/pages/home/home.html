<section class="hero" id="inicio">
  <div class="pf-container">
    <h1 class="pf-display name">
      <span class="line"><span style="--d: 0ms">Jhan Gutierrez</span></span>
      <span class="line dim"><span style="--d: 110ms">Desarrollador de software</span></span>
    </h1>
    <div class="hero-foot">
      <p class="pf-lead intro">
        Soy un apasionado del desarrollo backend con Java y Spring Boot, con experiencia en frontend con Angular y microservicios
        modernos. Me encanta construir soluciones eficientes y elegantes.
      </p>
      <div class="actions">
        <a class="pf-btn pf-btn--solid" routerLink="/proyectos">Ver proyectos</a>
        <a class="pf-btn pf-btn--quiet" routerLink="/contacto">Contacto</a>
        @if (site.cvPath) {
          <a class="pf-btn pf-btn--quiet" [href]="site.cvPath" target="_blank" rel="noopener noreferrer">Descargar CV</a>
        }
      </div>
    </div>
  </div>
</section>

<section class="softspark">
  <div class="pf-container">
    <app-softspark-band />
  </div>
</section>
